<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENTORA - Кинотеатр 4в1</title>
    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border-radius: 10px;
        }

        /* ===== ШАПКА ===== */
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff6b6b;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24, #f9ca24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 500px;
            min-width: 200px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #333;
            border-radius: 30px;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.2);
        }

        .search-box button {
            padding: 12px 25px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.4);
        }

        /* ===== КАТЕГОРИИ ===== */
        .categories {
            display: flex;
            gap: 15px;
            padding: 20px 40px;
            background: #0d0d0d;
            border-bottom: 1px solid #222;
            flex-wrap: wrap;
            overflow-x: auto;
        }

        .category-btn {
            padding: 12px 30px;
            border: 2px solid #333;
            border-radius: 30px;
            background: transparent;
            color: #aaa;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
            white-space: nowrap;
        }

        .category-btn:hover {
            border-color: #ff6b6b;
            color: #fff;
        }

        .category-btn.active {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border-color: #ff6b6b;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }

        /* ===== ФИЛЬТРЫ ===== */
        .filters {
            padding: 15px 40px;
            background: #0d0d0d;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .filters select {
            padding: 10px 20px;
            border: 2px solid #333;
            border-radius: 25px;
            background: #1a1a1a;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .filters select:hover {
            border-color: #ff6b6b;
        }

        .filters label {
            color: #aaa;
            font-weight: 500;
        }

        .stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .stats-item {
            background: #141414;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid #222;
            font-size: 13px;
        }

        .stats-item span {
            color: #ff6b6b;
            font-weight: 700;
        }

        /* ===== КОНТЕНТ ===== */
        .content {
            padding: 30px 40px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .content-header h2 {
            font-size: 28px;
            background: linear-gradient(45deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ===== СЕТКА ===== */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        /* ===== КАРТОЧКА ===== */
        .movie-card {
            background: #141414;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.4s;
            cursor: pointer;
            border: 1px solid #222;
        }

        .movie-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
        }

        .movie-poster {
            width: 100%;
            height: 310px;
            object-fit: cover;
            background: #1a1a1a;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 13px;
        }

        .movie-meta .year {
            color: #ff6b6b;
            font-weight: 600;
        }

        .movie-meta .rating {
            background: #ff6b6b;
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .movie-card .poster-wrapper {
            position: relative;
        }

        .movie-card .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 107, 107, 0.9);
            border: none;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            opacity: 0;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .movie-card:hover .play-btn {
            opacity: 1;
        }

        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            z-index: 3;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            padding: 20px;
            animation: fadeIn 0.3s;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-close {
            align-self: flex-end;
            background: #ff6b6b;
            border: none;
            color: #fff;
            font-size: 28px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .modal-close:hover {
            transform: rotate(90deg);
            background: #ee5a24;
        }

        .modal-content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .modal-poster {
            flex: 0 0 300px;
        }

        .modal-poster img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 0 60px rgba(255, 107, 107, 0.3);
        }

        .modal-details {
            flex: 1;
            min-width: 300px;
        }

        .modal-details h2 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #ff6b6b;
        }

        .modal-details .info-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .modal-details .info-row .label {
            color: #888;
            font-weight: 600;
            min-width: 100px;
        }

        .modal-details .info-row .value {
            color: #fff;
        }

        .modal-details .plot {
            margin-top: 20px;
            color: #ccc;
            line-height: 1.8;
        }

        .player-container {
            margin-top: 20px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .player-container video,
        .player-container iframe {
            width: 100%;
            max-height: 70vh;
            display: block;
            border: none;
        }

        .player-container .no-video {
            padding: 40px;
            text-align: center;
            color: #666;
            font-size: 18px;
        }

        .player-container .no-video .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .no-results {
            text-align: center;
            padding: 50px;
            color: #888;
            font-size: 20px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }
            .logo {
                font-size: 24px;
            }
            .search-box {
                max-width: 100%;
                min-width: 100%;
            }
            .categories {
                padding: 15px 20px;
                gap: 10px;
            }
            .category-btn {
                padding: 8px 20px;
                font-size: 13px;
            }
            .filters {
                padding: 10px 20px;
                gap: 10px;
            }
            .filters select {
                padding: 8px 15px;
                font-size: 12px;
            }
            .content {
                padding: 15px 20px;
            }
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
            .movie-poster {
                height: 220px;
            }
            .modal-poster {
                flex: 0 0 200px;
            }
            .modal-details h2 {
                font-size: 24px;
            }
            .stats {
                margin-left: 0;
            }
            .modal-content {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
            .movie-poster {
                height: 180px;
            }
            .modal-poster {
                flex: 0 0 150px;
            }
            .modal-details h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <div class="logo" onclick="loadAllMovies()">ZENTORA <span style="-webkit-text-fill-color: #666; font-weight: 300;">| 4в1</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Найти фильм, аниме, мультфильм, дораму..." onkeyup="if(event.key==='Enter') searchMovies()" />
            <button onclick="searchMovies()">Поиск</button>
        </div>
    </header>

    <!-- ===== КАТЕГОРИИ ===== -->
    <nav class="categories">
        <button class="category-btn active" data-category="all" onclick="filterCategory('all')">🎬 Все</button>
        <button class="category-btn" data-category="movie" onclick="filterCategory('movie')">🎥 Фильмы</button>
        <button class="category-btn" data-category="anime" onclick="filterCategory('anime')">🎌 Аниме</button>
        <button class="category-btn" data-category="cartoon" onclick="filterCategory('cartoon')">🧸 Мультфильмы</button>
        <button class="category-btn" data-category="drama" onclick="filterCategory('drama')">🇰🇷 Дорамы</button>
        <button class="category-btn" onclick="loadRandomMovies()">🎲 Случайные</button>
        <button class="category-btn" onclick="loadNewMovies()">🆕 Новинки</button>
    </nav>

    <!-- ===== ФИЛЬТРЫ ===== -->
    <div class="filters">
        <label>📅 Год:</label>
        <select id="yearFilter" onchange="applyFilters()">
            <option value="all">Все годы</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2015-2019">2015-2019</option>
            <option value="2010-2014">2010-2014</option>
            <option value="2000-2009">2000-2009</option>
            <option value="older">Старее 2000</option>
        </select>

        <label>🎭 Жанр:</label>
        <select id="genreFilter" onchange="applyFilters()">
            <option value="all">Все жанры</option>
            <option value="боевик">Боевик</option>
            <option value="комедия">Комедия</option>
            <option value="драма">Драма</option>
            <option value="фэнтези">Фэнтези</option>
            <option value="приключения">Приключения</option>
            <option value="мелодрама">Мелодрама</option>
            <option value="ужасы">Ужасы</option>
            <option value="фантастика">Фантастика</option>
            <option value="триллер">Триллер</option>
            <option value="криминал">Криминал</option>
            <option value="детектив">Детектив</option>
            <option value="аниме">Аниме</option>
            <option value="мультфильм">Мультфильм</option>
        </select>

        <div class="stats">
            <div class="stats-item">📺 Всего: <span id="totalMovies">0</span></div>
            <div class="stats-item">🎥 Фильмы: <span id="movieCount">0</span></div>
            <div class="stats-item">🎌 Аниме: <span id="animeCount">0</span></div>
            <div class="stats-item">🧸 Мульты: <span id="cartoonCount">0</span></div>
            <div class="stats-item">🇰🇷 Дорамы: <span id="dramaCount">0</span></div>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <div class="content">
        <div class="content-header">
            <h2>🔥 <span id="categoryLabel">Все категории</span></h2>
        </div>
        <div class="movies-grid" id="moviesGrid">
            <div class="loading">⏳ Загрузка фильмов...</div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
    <div class="modal" id="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-content">
            <div class="modal-poster">
                <img id="modalPoster" src="" alt="Постер">
            </div>
            <div class="modal-details">
                <h2 id="modalTitle">Название</h2>
                <div id="modalInfo"></div>
                <div class="plot" id="modalPlot">Описание</div>
                
                <div class="player-container">
                    <video id="videoPlayer" controls style="display:none;">
                        <source id="videoSource" src="" type="video/mp4">
                        Твой браузер не поддерживает видео.
                    </video>
                    <iframe id="iframePlayer" style="display:none;" allowfullscreen></iframe>
                    <div id="noVideo" class="no-video">
                        <div class="icon">🎬</div>
                        <p>🔍 Ищем видео...</p>
                        <small style="color:#444;">Автоматический поиск на YouTube</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ===== КОНФИГУРАЦИЯ =====
        // ============================================================
        const KINOPOISK_TOKEN = "01CVP95-R94MB8W-JB4N1QQ-5Z938DN";
        const KINOPOISK_API = "https://api.kinopoisk.dev/v1.4";
        
        let currentCategory = 'all';
        let allMovies = [];
        let currentMovie = null;

        // ============================================================
        // ===== ОПРЕДЕЛЕНИЕ КАТЕГОРИИ =====
        // ============================================================

        function getMovieCategory(movie) {
            const genres = movie.genres ? movie.genres.map(g => g.name.toLowerCase()) : [];
            const countries = movie.countries ? movie.countries.map(c => c.name) : [];
            const type = movie.type || '';
            
            // Аниме - жанр "аниме"
            if (genres.includes('аниме') || type === 'anime') {
                return 'anime';
            }
            
            // Мультфильмы - анимация (кроме аниме)
            if (genres.includes('мультфильм') || genres.includes('анимация') || type === 'cartoon') {
                return 'cartoon';
            }
            
            // Дорамы - сериалы из Азии
            if (type === 'tv-series' && countries.some(c => ['Корея Южная', 'Китай', 'Япония', 'Тайвань', 'Гонконг'].includes(c))) {
                return 'drama';
            }
            
            // Если сериал - дорама
            if (type === 'tv-series' || type === 'animated-series') {
                return 'drama';
            }
            
            // Всё остальное - фильмы
            return 'movie';
        }

        // ============================================================
        // ===== ЗАПРОСЫ К API КИНОПОИСКА =====
        // ============================================================

        async function apiRequest(endpoint) {
            try {
                const url = `${KINOPOISK_API}${endpoint}`;
                const response = await fetch(url, {
                    headers: {
                        'X-API-KEY': KINOPOISK_TOKEN,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Ошибка API:', error);
                return null;
            }
        }

        async function searchKinopoisk(query, page = 1, limit = 30) {
            const endpoint = `/movie/search?page=${page}&limit=${limit}&query=${encodeURIComponent(query)}`;
            return await apiRequest(endpoint);
        }

        async function getMovieById(id) {
            const endpoint = `/movie/${id}`;
            return await apiRequest(endpoint);
        }

        async function getMoviesByType(type, page = 1, limit = 30) {
            let endpoint = `/movie?page=${page}&limit=${limit}&sortField=rating.kp&sortType=-1`;
            
            // Фильтруем по типу контента
            if (type === 'movie') {
                endpoint += '&type=movie&year=2000-2025';
            } else if (type === 'anime') {
                endpoint += '&genres.name=аниме&year=2000-2025';
            } else if (type === 'cartoon') {
                endpoint += '&type=cartoon&year=2000-2025';
            } else if (type === 'drama') {
                endpoint += '&type=tv-series&countries.name=Корея Южная&year=2010-2025';
            }
            
            return await apiRequest(endpoint);
        }

        async function getNewMovies(page = 1, limit = 30) {
            const endpoint = `/movie?page=${page}&limit=${limit}&sortField=year&sortType=-1&year=2024-2025`;
            return await apiRequest(endpoint);
        }

        // ============================================================
        // ===== АВТОМАТИЧЕСКИЙ ПОИСК ВИДЕО =====
        // ============================================================

        async function findVideoUrl(title, year) {
            if (!title) return null;
            
            const searchQuery = encodeURIComponent(`${title} ${year || ''} трейлер`);
            
            // Пытаемся найти через YouTube (без API ключа - парсим страницу)
            try {
                const response = await fetch(`https://www.youtube.com/results?search_query=${searchQuery}`);
                const html = await response.text();
                
                // Ищем ID видео в HTML
                const match = html.match(/videoId":"([^"]+)"/);
                if (match && match[1]) {
                    return `https://www.youtube.com/embed/${match[1]}?autoplay=1`;
                }
            } catch (e) {
                console.log('YouTube поиск не удался');
            }
            
            return null;
        }

        // ============================================================
        // ===== ЗАГРУЗКА ФИЛЬМОВ =====
        // ============================================================

        async function loadAllMovies() {
            document.getElementById('moviesGrid').innerHTML = '<div class="loading">⏳ Загрузка всех категорий...</div>';
            
            const categories = ['movie', 'anime', 'cartoon', 'drama'];
            let allResults = [];
            
            for (const cat of categories) {
                const data = await getMoviesByType(cat);
                if (data && data.docs && data.docs.length > 0) {
                    allResults = allResults.concat(data.docs);
                }
            }
            
            if (allResults.length > 0) {
                allMovies = allResults;
                renderMovies(allMovies);
                document.getElementById('categoryLabel').textContent = 'Все категории';
                updateStats(allMovies);
            } else {
                document.getElementById('moviesGrid').innerHTML = '<div class="no-results">😕 Не удалось загрузить фильмы</div>';
            }
        }

        async function loadMoviesByQuery(query) {
            const data = await searchKinopoisk(query);
            if (data && data.docs && data.docs.length > 0) {
                allMovies = data.docs;
                renderMovies(allMovies);
                updateStats(allMovies);
                return true;
            }
            return false;
        }

        async function loadPopularMovies() {
            document.getElementById('moviesGrid').innerHTML = '<div class="loading">⏳ Загрузка популярных...</div>';
            const data = await getMoviesByType('movie');
            if (data && data.docs && data.docs.length > 0) {
                allMovies = data.docs;
                renderMovies(allMovies);
                document.getElementById('categoryLabel').textContent = 'Популярные фильмы';
                updateStats(allMovies);
                return true;
            }
            return false;
        }

        async function loadNewMovies() {
            document.getElementById('moviesGrid').innerHTML = '<div class="loading">⏳ Загрузка новинок...</div>';
            const data = await getNewMovies();
            if (data && data.docs && data.docs.length > 0) {
                allMovies = data.docs;
                renderMovies(allMovies);
                document.getElementById('categoryLabel').textContent = '🆕 Новинки 2024-2025';
                updateStats(allMovies);
                return true;
            }
            return false;
        }

        async function loadRandomMovies() {
            document.getElementById('moviesGrid').innerHTML = '<div class="loading">⏳ Загрузка случайных...</div>';
            const randomQueries = ['война', 'любовь', 'жизнь', 'приключения', 'фантастика', 'детектив', 'комедия', 'драма', 'боевик', 'триллер'];
            const randomQuery = randomQueries[Math.floor(Math.random() * randomQueries.length)];
            const success = await loadMoviesByQuery(randomQuery);
            if (success) {
                document.getElementById('categoryLabel').textContent = '🎲 Случайные';
            } else {
                document.getElementById('moviesGrid').innerHTML = '<div class="no-results">😕 Не удалось загрузить фильмы</div>';
            }
        }

        async function searchMovies() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('Введи название для поиска!');
                return;
            }
            document.getElementById('moviesGrid').innerHTML = '<div class="loading">🔍 Поиск...</div>';
            const success = await loadMoviesByQuery(query);
            if (success) {
                document.getElementById('categoryLabel').textContent = `🔍 "${query}"`;
            } else {
                document.getElementById('moviesGrid').innerHTML = `<div class="no-results">😕 Ничего не найдено по запросу "${query}"</div>`;
            }
        }

        // ============================================================
        // ===== ОТОБРАЖЕНИЕ =====
        // ============================================================

        function renderMovies(movies) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            if (!movies || movies.length === 0) {
                grid.innerHTML = '<div class="no-results">😕 Фильмы не найдены</div>';
                return;
            }
            
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openModal(movie.id);
                
                const poster = movie.poster?.url || 'https://via.placeholder.com/300x400/1a1a2e/ff6b6b?text=No+Image';
                const rating = movie.rating?.kp || movie.rating?.imdb || '—';
                const year = movie.year || '—';
                const title = movie.name || movie.alternativeName || 'Без названия';
                
                const category = getMovieCategory(movie);
                const categoryEmojis = {
                    'movie': '🎥',
                    'anime': '🎌',
                    'cartoon': '🧸',
                    'drama': '🇰🇷'
                };
                
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${poster}" alt="${title}" class="movie-poster" onerror="this.src='https://via.placeholder.com/300x400/1a1a2e/ff6b6b?text=No+Image'"/>
                        <div class="play-btn">▶</div>
                        <span class="category-badge">${categoryEmojis[category] || '🎬'}</span>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-meta">
                            <span class="year">${year}</span>
                            <span class="rating">⭐ ${typeof rating === 'number' ? rating.toFixed(1) : rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateStats(movies) {
            document.getElementById('totalMovies').textContent = movies.length;
            
            let movieCount = 0, animeCount = 0, cartoonCount = 0, dramaCount = 0;
            
            movies.forEach(m => {
                const cat = getMovieCategory(m);
                if (cat === 'movie') movieCount++;
                else if (cat === 'anime') animeCount++;
                else if (cat === 'cartoon') cartoonCount++;
                else if (cat === 'drama') dramaCount++;
            });
            
            document.getElementById('movieCount').textContent = movieCount;
            document.getElementById('animeCount').textContent = animeCount;
            document.getElementById('cartoonCount').textContent = cartoonCount;
            document.getElementById('dramaCount').textContent = dramaCount;
        }

        // ============================================================
        // ===== ФИЛЬТРАЦИЯ =====
        // ============================================================

        function filterCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                }
            });
            
            applyFilters();
        }

        function applyFilters() {
            let filtered = [...allMovies];
            
            // Фильтр по категории
            if (currentCategory !== 'all') {
                filtered = filtered.filter(m => getMovieCategory(m) === currentCategory);
            }
            
            // Фильтр по году
            const yearFilter = document.getElementById('yearFilter').value;
            if (yearFilter !== 'all') {
                filtered = filtered.filter(m => {
                    const year = m.year;
                    if (yearFilter === '2015-2019') return year >= 2015 && year <= 2019;
                    if (yearFilter === '2010-2014') return year >= 2010 && year <= 2014;
                    if (yearFilter === '2000-2009') return year >= 2000 && year <= 2009;
                    if (yearFilter === 'older') return year < 2000;
                    return year === parseInt(yearFilter);
                });
            }
            
            // Фильтр по жанру
            const genreFilter = document.getElementById('genreFilter').value;
            if (genreFilter !== 'all') {
                filtered = filtered.filter(m => {
                    if (!m.genres) return false;
                    return m.genres.some(g => g.name.toLowerCase().includes(genreFilter.toLowerCase()));
                });
            }
            
            renderMovies(filtered);
            updateStats(filtered);
            
            const labels = {
                'all': 'Все категории',
                'movie': '🎥 Фильмы',
                'anime': '🎌 Аниме',
                'cartoon': '🧸 Мультфильмы',
                'drama': '🇰🇷 Дорамы'
            };
            document.getElementById('categoryLabel').textContent = labels[currentCategory] || 'Все категории';
        }

        // ============================================================
        // ===== МОДАЛЬНОЕ ОКНО =====
        // ============================================================

        async function openModal(movieId) {
            const modal = document.getElementById('modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('iframePlayer');
            const noVideo = document.getElementById('noVideo');
            
            video.style.display = 'none';
            iframe.style.display = 'none';
            noVideo.style.display = 'block';
            video.pause();
            
            document.getElementById('modalTitle').textContent = '⏳ Загрузка...';
            document.getElementById('modalInfo').innerHTML = '';
            document.getElementById('modalPlot').textContent = 'Загрузка информации...';
            document.getElementById('modalPoster').src = 'https://via.placeholder.com/300x450/1a1a2e/ff6b6b?text=Loading';
            
            const movie = await getMovieById(movieId);
            if (!movie) {
                document.getElementById('modalTitle').textContent = '❌ Ошибка загрузки';
                return;
            }
            
            currentMovie = movie;
            
            document.getElementById('modalTitle').textContent = movie.name || movie.alternativeName || 'Без названия';
            document.getElementById('modalPoster').src = movie.poster?.url || 'https://via.placeholder.com/300x450/1a1a2e/ff6b6b?text=No+Image';
            
            let infoHTML = '';
            if (movie.year) infoHTML += `<div class="info-row"><span class="label">📅 Год:</span><span class="value">${movie.year}</span></div>`;
            if (movie.genres) infoHTML += `<div class="info-row"><span class="label">🎭 Жанр:</span><span class="value">${movie.genres.map(g => g.name).join(', ')}</span></div>`;
            if (movie.countries) infoHTML += `<div class="info-row"><span class="label">🌍 Страна:</span><span class="value">${movie.countries.map(c => c.name).join(', ')}</span></div>`;
            if (movie.directors && movie.directors.length > 0) infoHTML += `<div class="info-row"><span class="label">🎥 Режиссёр:</span><span class="value">${movie.directors.map(d => d.name).join(', ')}</span></div>`;
            if (movie.actors && movie.actors.length > 0) infoHTML += `<div class="info-row"><span class="label">👥 Актёры:</span><span class="value">${movie.actors.slice(0, 5).map(a => a.name).join(', ')}</span></div>`;
            if (movie.rating) {
                const ratings = [];
                if (movie.rating.kp) ratings.push(`КП: ${movie.rating.kp}`);
                if (movie.rating.imdb) ratings.push(`IMDb: ${movie.rating.imdb}`);
                if (ratings.length > 0) infoHTML += `<div class="info-row"><span class="label">📊 Рейтинг:</span><span class="value">${ratings.join(' | ')}</span></div>`;
            }
            
            const category = getMovieCategory(movie);
            const categoryEmojis = {
                'movie': '🎥',
                'anime': '🎌',
                'cartoon': '🧸',
                'drama': '🇰🇷'
            };
            infoHTML += `<div class="info-row"><span class="label">📂 Категория:</span><span class="value">${categoryEmojis[category] || '🎬'} ${category}</span></div>`;
            
            document.getElementById('modalInfo').innerHTML = infoHTML;
            document.getElementById('modalPlot').textContent = movie.description || movie.shortDescription || 'Описание отсутствует';
            
            // Ищем видео автоматически
            noVideo.querySelector('p').textContent = '🔍 Ищем видео на YouTube...';
            const videoUrl = await findVideoUrl(movie.name || movie.alternativeName, movie.year);
            
            if (videoUrl) {
                playVideo(videoUrl);
                noVideo.querySelector('p').textContent = '✅ Видео найдено!';
            } else {
                noVideo.querySelector('p').textContent = '😕 Видео не найдено';
                noVideo.querySelector('small').textContent = 'Попробуй поискать вручную на YouTube';
            }
        }

        function playVideo(url) {
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('iframePlayer');
            const noVideo = document.getElementById('noVideo');
            
            video.style.display = 'none';
            iframe.style.display = 'none';
            noVideo.style.display = 'none';
            video.pause();
            
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = url.split('v=')[1] || url.split('/').pop().split('?')[0];
                iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                iframe.style.display = 'block';
            } else if (url.includes('vk.com')) {
                iframe.src = url;
                iframe.style.display = 'block';
            } else if (url.endsWith('.mp4') || url.endsWith('.webm')) {
                document.getElementById('videoSource').src = url;
                video.load();
                video.style.display = 'block';
                video.play();
            } else {
                iframe.src = url;
                iframe.style.display = 'block';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('videoPlayer').pause();
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // ===== ИНИЦИАЛИЗАЦИЯ =====
        // ============================================================

        // Загружаем все категории при старте
        loadAllMovies();
        
        console.log('🎬 ZENTORA 4в1 загружен!');
        console.log(`🔑 Токен: ${KINOPOISK_TOKEN}`);
        console.log('📌 Категории: Фильмы | Аниме | Мультфильмы | Дорамы');
        console.log('🤖 Всё загружается автоматически из kinopoisk.dev');
        console.log('💡 Нажми на карточку чтобы открыть плеер');
    </script>
</body>
</html>
